[project]
name = "kr-stock-analyzer"
version = "0.1.0"
description = "한국 상장기업 AI 멀티에이전트 분석 시스템"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
    "streamlit>=1.38.0",
    "plotly>=5.20.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]
pdf = [
    "weasyprint>=62.0",
    "jinja2>=3.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
